name: CashCrusher static lint

on:
  push:
    branches: [main, gate-00-context-engine]
  pull_request:

jobs:
  custom-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint f$cc dependencies
        run: python tools/lint_custom_dependencies.py
      - name: Test multiway stack geometry contract
        run: python tools/test_multiway_stack_geometry.py
      - name: Test flop action history contract
        run: python tools/test_flop_action_history.py
      - name: Test Turn CBet source-boundary contract
        run: python tools/test_turn_cbet_contract.py
      - name: Test post-multiway HU Turn CBet contract
        run: python tools/test_turn_postmultiway_hu.py
      - name: Test ordinary-SRP multiway Turn CBet contract
        run: python tools/test_turn_multiway_srp.py
      - name: Test isolation-pot Turn CBet contract
        run: python tools/test_turn_iso.py
      - name: Test plain 3bet-pot Turn CBet contract
        run: python tools/test_turn_plain3bp.py
      - name: Test squeeze-pot Turn CBet contract
        run: python tools/test_turn_squeeze.py
      - name: Test clean HU 4bet-pot Turn CBet contract
        run: python tools/test_turn_4bp.py
      - name: Test Turn CBet coverage boundary
        run: python tools/test_turn_cbet_coverage.py
      - name: Test Turn CBet runtime sizing contract
        run: python tools/test_turn_cbet_runtime.py
      - name: Test closed Turn action-history contract
        run: python tools/test_turn_action_history.py
      - name: Test River CBet source/provenance contract
        run: python tools/test_river_cbet_source_contract.py
      - name: Test six-max SRP River CBet gaps
        run: python tools/test_river_cbet_srp_gaps.py
      - name: Test ISO 3BP squeeze 4BP River CBet
        run: python tools/test_river_cbet_other_pots.py
      - name: Test canonical River CBet coverage boundary
        run: python tools/test_river_cbet_coverage.py
      - name: Test River CBet runtime sizing contract
        run: python tools/test_river_cbet_runtime.py
      - name: Test Flop Float source and topology contract
        run: python tools/test_flop_float_contract.py
      - name: Test Flop Float coverage boundary
        run: python tools/test_flop_float_coverage.py
      - name: Test Flop Float runtime sizing contract
        run: python tools/test_flop_float_runtime.py
      - name: Test closed Flop Float action-history contract
        run: python tools/test_flop_float_history.py
      - name: Test lastraised final-aggressor and 3BP caller repair
        run: python tools/test_final_aggressor_context.py
      - name: Test Turn Float history/opportunity contract
        run: python tools/test_turn_float_history.py
      - name: Test Turn Float direct-source strategy contract
        run: python tools/test_turn_float_source.py
      - name: Test Turn Float coverage/provenance contract
        run: python tools/test_turn_float_coverage.py
      - name: Test Turn Float runtime sizing contract
        run: python tools/test_turn_float_runtime.py
      - name: Test closed Turn Float action-history contract
        run: python tools/test_turn_float_action_history.py
      - name: Test River Float history/source ownership contract
        run: python tools/test_river_float_history.py
      - name: Test River Float direct-source strategy contract
        run: python tools/test_river_float_source.py
      - name: Test ordinary-SRP River Float six-max gaps
        run: python tools/test_river_float_srp_gaps.py
      - name: Test ISO River Float gaps
        run: python tools/test_river_float_iso.py
      - name: Test plain 3BP and squeeze River Float gaps
        run: python tools/test_river_float_3bp.py
      - name: Test clean HU 4BP River Float gaps
        run: python tools/test_river_float_4bp.py
      - name: Test canonical River Float coverage boundary
        run: python tools/test_river_float_coverage.py
      - name: Test River Float runtime sizing contract
        run: python tools/test_river_float_runtime.py
      - name: Test direct-source Flop Donk contract
        run: python tools/test_flop_donk_source.py
      - name: Test 4-6h BTN plus blinds Flop Donk adaptation
        run: python tools/test_flop_donk_6max.py
      - name: Test HU Flop Donk reviewed-check baseline
        run: python tools/test_flop_donk_hu.py
      - name: Test residual multiway SRP Flop Donk baseline
        run: python tools/test_flop_donk_multiway_srp.py
      - name: Test isolation-pot Flop Donk baseline
        run: python tools/test_flop_donk_iso.py
      - name: Test 3BP and squeeze Flop Donk baseline
        run: python tools/test_flop_donk_3bp.py
      - name: Test residual unraised multiway Flop Donk policy
        run: python tools/test_flop_donk_unraised_multiway.py
      - name: Test clean HU caller-side 4BP Flop Donk baseline
        run: python tools/test_flop_donk_4bp.py
      - name: Test Flop Donk runtime sizing contract
        run: python tools/test_flop_donk_runtime.py
      - name: Test closed Flop Donk action-history contract
        run: python tools/test_flop_donk_history.py
      - name: Test Turn Donk ownership/history contract
        run: python tools/test_turn_donk_history.py
      - name: Test direct native Turn Donk source strategy
        run: python tools/test_turn_donk_source.py
      - name: Test HUBB Turn Donk source/provenance contract
        run: python tools/test_turn_donk_hubb.py
      - name: Test SBvBTN Turn Donk source/provenance contract
        run: python tools/test_turn_donk_sbvbtn.py
